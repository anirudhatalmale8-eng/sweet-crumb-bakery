<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Illustration of a large scored sourdough loaf resting on a linen cloth, dusted with flour">
  <title>Sourdough, cooling</title>
  <defs>
    <linearGradient id="bg2" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#F3DFBD"/>
      <stop offset="1" stop-color="#DBA162"/>
    </linearGradient>
    <linearGradient id="crustG" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#EEB367"/>
      <stop offset="1" stop-color="#C5762B"/>
    </linearGradient>
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="640" height="800" fill="url(#bg2)"/>
  <circle cx="300" cy="300" r="238" fill="#F8E9CA" opacity=".36"/>

  <!-- linen cloth across the base -->
  <g>
    <path d="M0 686l320-74 320 62v126H0Z" fill="#F4E7D0"/>
    <path d="M0 686l320-74 320 62" fill="none" stroke="#D9BF98" stroke-width="5"/>
    <path d="M168 664l22 136M472 668l-16 132" stroke="#E4D0AE" stroke-width="7" opacity=".9"/>
  </g>

  <!-- hero loaf -->
  <g transform="translate(320 456) rotate(-5)">
    <ellipse cx="6" cy="172" rx="172" ry="26" fill="#A9611F" opacity=".2"/>
    <circle cx="0" cy="14" r="160" fill="#A85D1D"/>
    <circle cx="0" cy="0" r="160" fill="url(#crustG)"/>
    <!-- the ear: one long score with a lifted lip -->
    <path d="M-134 -42C-86 -88 86 -88 134 -42" stroke="#8B3F13" stroke-width="18" fill="none" stroke-linecap="round" opacity=".92"/>
    <path d="M-130 -54C-84 -96 84 -96 130 -54" stroke="#F6D69F" stroke-width="8" fill="none" stroke-linecap="round" opacity=".6"/>
    <!-- wheat-stalk cuts, on the diagonal -->
    <g stroke="#8B3F13" stroke-width="11" stroke-linecap="round" fill="none" opacity=".58">
      <path d="M-82 42l52 -28M-52 88l52 -28M-22 134l52 -28"/>
    </g>
    <g stroke="#8B3F13" stroke-width="8" stroke-linecap="round" fill="none" opacity=".38">
      <path d="M42 34l48 -24M70 76l48 -24"/>
    </g>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#8B3F13" stroke-width="5" opacity=".34"/>
    <g fill="#8B3F13" opacity=".2">
      <circle cx="-124" cy="10" r="6.5"/><circle cx="-104" cy="66" r="5"/><circle cx="116" cy="-2" r="5.5"/>
      <circle cx="94" cy="96" r="4.5"/><circle cx="-36" cy="-112" r="4.5"/><circle cx="52" cy="-124" r="4"/>
    </g>
  </g>

  <!-- half loaf, showing the crumb -->
  <g transform="translate(486 660) rotate(-9)">
    <ellipse cx="0" cy="30" rx="96" ry="18" fill="#8B3F13" opacity=".16"/>
    <path d="M-88 22a88 62 0 0 1 176 0Z" fill="url(#crustG)"/>
    <path d="M-88 22a88 62 0 0 1 176 0Z" fill="none" stroke="#8B3F13" stroke-width="4.5" opacity=".4"/>
    <path d="M-74 22a74 48 0 0 1 148 0Z" fill="#F6E4C2"/>
    <g fill="#DFC291">
      <circle cx="-38" cy="4" r="7"/><circle cx="-6" cy="-12" r="9"/><circle cx="28" cy="2" r="6"/>
      <circle cx="52" cy="14" r="5"/><circle cx="-58" cy="16" r="5"/><circle cx="10" cy="14" r="6"/>
    </g>
  </g>

  <!-- flour dusting -->
  <g fill="#FDF7EA">
    <g opacity=".85"><circle cx="106" cy="716" r="6"/><circle cx="152" cy="744" r="3.5"/><circle cx="196" cy="708" r="4"/><circle cx="74" cy="758" r="4"/></g>
    <g opacity=".5"><circle cx="118" cy="226" r="5"/><circle cx="160" cy="180" r="3"/><circle cx="80" cy="298" r="3.5"/></g>
  </g>

  <rect width="640" height="800" filter="url(#grain2)" opacity=".14" style="mix-blend-mode:multiply"/>
</svg>
