<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Illustration of butter croissants lined up on a baking tray with khari alongside">
  <title>Croissants, out at half past eight</title>
  <defs>
    <linearGradient id="bg3" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#F2E1C6"/>
      <stop offset="1" stop-color="#D4925A"/>
    </linearGradient>
    <linearGradient id="crG" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#F0B96F"/>
      <stop offset="1" stop-color="#C97D31"/>
    </linearGradient>
    <filter id="grain3"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>

    <g id="cr">
      <ellipse cx="0" cy="30" rx="86" ry="17" fill="#8B3F13" opacity=".16"/>
      <path d="M-84 20C-74-44-28-70 0-70S74-44 84 20C52-12 26-24 0-24S-52-12-84 20Z" fill="url(#crG)" stroke="#8B3F13" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-42-40C-32-20-32-8-35 2M0-52C7-28 7-14 4-4M42-40C32-20 32-8 35 2" stroke="#8B3F13" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".6"/>
      <path d="M-64 0C-52-24-32-40-14-46" stroke="#FAE1B2" stroke-width="7" fill="none" stroke-linecap="round" opacity=".65"/>
      <path d="M-84 20c-15-5-19-18-13-27M84 20c15-5 19-18 13-27" fill="none" stroke="#8B3F13" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="640" height="800" fill="url(#bg3)"/>
  <circle cx="380" cy="268" r="228" fill="#F9EACB" opacity=".4"/>

  <!-- steam, off to one side -->
  <g stroke="#FDF6E8" stroke-width="8" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M206 300c-18-26 18-40 0-68"/>
    <path d="M276 262c-16-24 16-36 0-62"/>
  </g>

  <!-- tray, tilted, well inside the frame -->
  <g transform="rotate(-4 320 560)">
    <rect x="96" y="352" width="452" height="392" rx="26" fill="#7A4D24"/>
    <rect x="112" y="368" width="420" height="360" rx="18" fill="#A3702F"/>
    <rect x="112" y="368" width="420" height="360" rx="18" fill="none" stroke="#5E3A1A" stroke-width="5"/>
    <path d="M132 388h380l-12 320H144Z" fill="#F7EBD4"/>
    <path d="M132 388h380l-12 320H144Z" fill="none" stroke="#E0CBA6" stroke-width="3"/>
  </g>

  <!-- croissants on a diagonal, scaled to sit on the parchment -->
  <g transform="translate(232 452) rotate(-13) scale(.78)"><use href="#cr"/></g>
  <g transform="translate(360 570) rotate(-6) scale(.78)"><use href="#cr"/></g>
  <g transform="translate(244 672) rotate(5) scale(.78)"><use href="#cr"/></g>

  <!-- khari stacked in one corner -->
  <g transform="translate(424 696) rotate(-8) scale(.82)">
    <rect x="-70" y="-20" width="140" height="40" rx="10" fill="#EFC98F" stroke="#8B3F13" stroke-width="4"/>
    <path d="M-70 -6h140M-70 6h140" stroke="#8B3F13" stroke-width="3" opacity=".42"/>
  </g>
  <g transform="translate(438 652) rotate(6) scale(.82)">
    <rect x="-64" y="-18" width="128" height="36" rx="9" fill="#F2D4A0" stroke="#8B3F13" stroke-width="4"/>
    <path d="M-64 -5h128M-64 5h128" stroke="#8B3F13" stroke-width="3" opacity=".42"/>
  </g>

  <!-- butter flakes -->
  <g fill="#FBEBC8" opacity=".75">
    <circle cx="168" cy="596" r="5"/><circle cx="192" cy="624" r="3"/><circle cx="330" cy="700" r="4"/><circle cx="406" cy="480" r="4.5"/><circle cx="436" cy="508" r="3"/>
  </g>

  <rect width="640" height="800" filter="url(#grain3)" opacity=".14" style="mix-blend-mode:multiply"/>
</svg>
